[package]
name = "zen-net"
description = "Zen Platform, layer L1: one proxy setting and the HTTP agent every network request of the IDE is built from."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
schemars.workspace = true
serde.workspace = true

# The network: desktop only, as in zen-update. The settings stay available in WebAssembly builds.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
hex.workspace = true
rustls.workspace = true
rustls-rustcrypto.workspace = true
sha2.workspace = true
ureq = { workspace = true, features = ["socks-proxy"] }
webpki-roots.workspace = true
x509-cert = { version = "0.2", default-features = false, features = ["pem"] }

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true

[features]
test-proxy = []

[lints]
workspace = true
