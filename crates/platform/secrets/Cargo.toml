[package]
name = "zen-secrets"
description = "Zen Platform, layer L0: secrets kept in the system's credential store (the macOS Keychain), never printed."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
schemars.workspace = true
serde.workspace = true
zeroize.workspace = true

# The Keychain, on macOS only (ADR-0165); elsewhere the crate is plain Rust and its system store
# reports that it is unsupported.
[target.'cfg(target_os = "macos")'.dependencies]
keyring-core.workspace = true
apple-native-keyring-store.workspace = true
security-framework.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
