[package]
name = "zen-vcs"
description = "Zen Platform, layer L2: version control: git status, branches, commits, history and blame."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Line and word diffs (pure Rust, also in WebAssembly builds): change markers and the diff viewer.
gix-imara-diff.workspace = true
# The log's text filter as a regular expression (pure Rust).
regex.workspace = true
# Patches written and read in another encoding than UTF-8 (pure Rust; gitoxide uses it too).
encoding_rs.workspace = true

# Reading repositories (gitoxide, pure Rust) and running the `git` program for the operations that
# write: desktop only (ADR-0047). In WebAssembly builds there is no repository.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gix.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
