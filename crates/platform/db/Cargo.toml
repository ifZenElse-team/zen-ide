[package]
name = "zen-db"
description = "Zen Platform, layer L2: the database engine: connections, connection types, the driver interface by data model, the PostgreSQL and SQLite drivers and its own runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
zen-secrets.workspace = true
zen-syntax.workspace = true
postcard.workspace = true
crc32fast.workspace = true
roxmltree.workspace = true
zeroize.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["time", "sync", "process", "io-util", "net"] }
tokio-util.workspace = true
futures-util = { workspace = true, features = ["sink"] }
fallible-iterator.workspace = true
bytes.workspace = true
tokio-postgres.workspace = true
tokio-postgres-rustls.workspace = true
postgres-protocol.workspace = true
mysql_async.workspace = true
rustls.workspace = true
rustls-rustcrypto.workspace = true
webpki-roots.workspace = true
jiff.workspace = true
redis.workspace = true
ureq.workspace = true
sha2.workspace = true
parquet.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[[bin]]
name = "zen-db-reference-driver"
path = "reference-driver/main.rs"
test = false
doc = false

[dev-dependencies]
tempfile.workspace = true

[features]
fake = []

[lints]
workspace = true
