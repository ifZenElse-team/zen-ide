import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.component.ProjectComponentIdentifier
import org.gradle.api.artifacts.result.ResolvedDependencyResult
import org.gradle.util.GradleVersion

def zenOut = System.getProperty('zen.model.out')

if (zenOut != null && gradle.parent == null && GradleVersion.current() >= GradleVersion.version('8.0')) {
    gradle.settingsEvaluated { settings ->
        if (new File(settings.rootDir, 'buildSrc').isDirectory()) {
            gradle.startParameter.taskNames = [':buildSrc:zenModel'] + gradle.startParameter.taskNames
        }
    }
}
def zenTree
zenTree = { component, seen ->
    component.dependencies.collect { dependency ->
        if (!(dependency instanceof ResolvedDependencyResult)) {
            return [requested: dependency.requested.displayName, unresolved: dependency.failure?.message?.readLines()?.first() ?: '']
        }
        def selected = dependency.selected
        def id = selected.id
        def node = id instanceof ModuleComponentIdentifier
            ? [groupId: id.group, artifactId: id.module, version: id.version]
            : (id instanceof ProjectComponentIdentifier ? [project: id.projectPath] : [requested: id.displayName])
        def requested = dependency.requested.displayName
        if (id instanceof ModuleComponentIdentifier && requested.count(':') > 1 && requested != "${id.group}:${id.module}:${id.version}") {
            node.requested = requested
        }
        if (seen.add(id)) {
            def children = zenTree(selected, seen)
            if (!children.isEmpty()) {
                node.children = children
            }
        } else if (!selected.dependencies.isEmpty()) {
            node.repeated = true
        }
        node
    }
}
allprojects { p ->
    if (zenOut == null) {
        return
    }
    p.tasks.register('zenModel') {
        if (p == p.rootProject) {
            dependsOn p.subprojects.collect { it.path + ':zenModel' }
            dependsOn p.gradle.includedBuilds.collect { it.task(':zenModel') }
        }
        doLast {
            def treePath = p.hasProperty('buildTreePath') ? p.buildTreePath
                : (p.gradle.parent == null ? p.path : ':' + p.rootProject.name + (p.path == ':' ? '' : p.path))
            def build = p.path == ':' ? treePath : treePath.substring(0, treePath.length() - p.path.length())
            def sets = p.extensions.findByName('sourceSets')
            def wanted = p.configurations.findAll { it.canBeResolved && it.name ==~ /(?i).*(compile|runtime)classpath|.*annotationProcessor/ }
            def model = [
                build: build.isEmpty() ? ':' : build,
                path: treePath,
                name: p.name,
                folder: p.projectDir.path,
                buildFile: p.buildFile.isFile() ? p.buildFile.path : null,
                tasks: p.tasks.findAll { !it.name.startsWith('zen') }.collect { [name: it.name, group: it.group ?: 'other', description: it.description ?: ''] },
                sourceSets: sets == null ? [] : sets.collect { set ->
                    [name: set.name, sources: set.allJava.srcDirs*.path, resources: set.resources.srcDirs*.path, output: set.output.classesDirs.files*.path]
                },
                configurations: wanted.collect { configuration ->
                    try {
                        [name: configuration.name, dependencies: zenTree(configuration.incoming.resolutionResult.root, new HashSet())]
                    } catch (Exception failure) {
                        [name: configuration.name, dependencies: [], error: failure.message ?: '']
                    }
                }
            ]
            def file = new File(zenOut, treePath.replaceAll('[^A-Za-z0-9_.-]', '_') + '-' + treePath.hashCode() + '.json')
            file.parentFile.mkdirs()
            file.text = JsonOutput.toJson(model)
        }
    }
}
