# Downloads: desktop only. The crate itself stays free of networking in WebAssembly builds.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq.workspace = true
zen-net.workspace = true

[dev-dependencies]
zen-net = { workspace = true, features = ["test-proxy"] }
tempfile.workspace = true

[lints]
workspace = true
