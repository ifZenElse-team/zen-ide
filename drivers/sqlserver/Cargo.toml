[package]
name = "zen-db-sqlserver"
description = "Zen IDE database driver program for Microsoft SQL Server and Azure SQL over TDS, speaking the external driver protocol v1 (ADR-0174, ADR-0175)."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "zen-db-sqlserver"
path = "src/main.rs"

[dependencies]
zen-db-driver-kit.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "sync", "time"] }
tokio-util = { workspace = true, features = ["compat"] }
futures-util = { workspace = true, features = ["io"] }
tiberius.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true

[dev-dependencies]
rustls-rustcrypto.workspace = true
ed25519-dalek.workspace = true

[lints]
workspace = true
