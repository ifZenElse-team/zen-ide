[package]
name = "zen-db-mongodb"
description = "Zen IDE database driver program for MongoDB over its wire protocol (OP_MSG), speaking the external driver protocol v1 (ADR-0174, ADR-0175)."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "zen-db-mongodb"
path = "src/main.rs"

[dependencies]
zen-db-driver-kit.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "sync", "time"] }
rustls.workspace = true
tokio-rustls.workspace = true
bson.workspace = true
sha1.workspace = true
sha2.workspace = true
hmac.workspace = true
md-5.workspace = true
base64.workspace = true
stringprep.workspace = true
getrandom.workspace = true

[lints]
workspace = true
