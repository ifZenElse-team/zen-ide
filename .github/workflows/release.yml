name: Release

# The release of a tag v<YY.M.N> (ADR-0300, docs/releasing.md "Releasing from a tag on GitHub").
# The builds are the workflow `release-parts.yml`, the same jobs the nightly dry run calls; they read
# no secret, sign nothing and publish nothing, and its plan stops the release before anything is
# built when the tag is not one a release can come from. The jobs after the builds run only when
# the repository variable ZEN_RELEASE_FROM_GITHUB is `true`; until the owner sets it, a tag's run
# ends with the artefact `release`.
#
# - stage (environment `release`): signs the manifest and the catalog and stages everything on the
#   release server; nothing is live.
# - verify: downloads every staged file and checks it against the build.
# - draft: writes the draft GitHub release of the tag (the only jobs with `contents: write` are
#   this one and `publish`, and neither has a release secret).
# - live (environment `release`, its reviewers approve): one request makes the stage live.
# - publish: publishes the draft.
#
# The release secrets are given only to the one step of `stage` and of `live` that signs or sends,
# after everything those jobs compile is compiled; the first step of each checks that they are set,
# printing only whether they are.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  TZ: UTC

jobs:
  build:
    name: Build
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/release-parts.yml
    with:
      dry-run: false
      from-github: ${{ vars.ZEN_RELEASE_FROM_GITHUB == 'true' }}

  stage:
    name: Stage
    needs: build
    if: "!cancelled() && needs.build.result == 'success' && vars.ZEN_RELEASE_FROM_GITHUB == 'true'"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: release
    concurrency:
      group: release-server
      cancel-in-progress: false
    steps:
      - name: The release secrets are set (only whether they are is printed)
        env:
          HAS_KEY: ${{ secrets.ZEN_PUBLISHER_KEY != '' }}
          HAS_TOKEN: ${{ secrets.ZEN_RELEASES_TOKEN != '' }}
          HAS_SERVER: ${{ vars.ZEN_RELEASES_SERVER != '' }}
        run: |
          set -eu
          missing=""
          [ "$HAS_KEY" = true ] || missing="$missing ZEN_PUBLISHER_KEY"
          [ "$HAS_TOKEN" = true ] || missing="$missing ZEN_RELEASES_TOKEN"
          [ "$HAS_SERVER" = true ] || missing="$missing ZEN_RELEASES_SERVER"
          if [ -n "$missing" ]; then
            echo "::error::The environment release lacks:$missing (Settings, Environments, release); nothing was signed or sent."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: .
      - name: Build the release tools (no secret is in this step)
        run: |
          set -eu
          cargo build --locked --package xtask
          cargo build --release --locked --package zen-releases
      - name: Sign and stage
        env:
          ZEN_PUBLISHER_KEY: ${{ secrets.ZEN_PUBLISHER_KEY }}
          ZEN_RELEASES_TOKEN: ${{ secrets.ZEN_RELEASES_TOKEN }}
          ZEN_RELEASES_SERVER: ${{ vars.ZEN_RELEASES_SERVER }}
        run: cargo xtask release-ci stage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage
          path: release-stage.json
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Verify
    needs: stage
    if: "!cancelled() && needs.stage.result == 'success'"
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stage
          path: .
      - name: Download every staged file and check it
        run: cargo xtask release-ci verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify
          path: release-verify.json
          if-no-files-found: error
          retention-days: 7

  draft:
    name: Draft of the GitHub release
    needs: [stage, verify]
    if: "!cancelled() && needs.stage.result == 'success' && needs.verify.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stage
          path: .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verify
          path: .
      - name: The notes, the files and the checks
        run: |
          set -eu
          cargo xtask release-ci notes
          cat release-notes.md
      - name: Write the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          state=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          case "$state" in
            true) gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft --title "Zen IDE ${tag#v}" --notes-file release-notes.md ;;
            none) gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Zen IDE ${tag#v}" --notes-file release-notes.md ;;
            *) echo "The release of $tag is published already; the draft was not written."; exit 1 ;;
          esac

  live:
    name: Release
    needs: [stage, verify, draft]
    if: "!cancelled() && needs.stage.result == 'success' && needs.verify.result == 'success' && needs.draft.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    concurrency:
      group: release-server
      cancel-in-progress: false
    steps:
      - name: The release secrets are set (only whether they are is printed)
        env:
          HAS_KEY: ${{ secrets.ZEN_PUBLISHER_KEY != '' }}
          HAS_TOKEN: ${{ secrets.ZEN_RELEASES_TOKEN != '' }}
          HAS_SERVER: ${{ vars.ZEN_RELEASES_SERVER != '' }}
        run: |
          set -eu
          missing=""
          [ "$HAS_KEY" = true ] || missing="$missing ZEN_PUBLISHER_KEY"
          [ "$HAS_TOKEN" = true ] || missing="$missing ZEN_RELEASES_TOKEN"
          [ "$HAS_SERVER" = true ] || missing="$missing ZEN_RELEASES_SERVER"
          if [ -n "$missing" ]; then
            echo "::error::The environment release lacks:$missing (Settings, Environments, release); nothing was signed or sent."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stage
          path: .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verify
          path: .
      - name: Build the release tools (no secret is in this step)
        run: |
          set -eu
          cargo build --locked --package xtask
          cargo build --release --locked --package zen-releases
      - name: Make the stage live
        env:
          ZEN_PUBLISHER_KEY: ${{ secrets.ZEN_PUBLISHER_KEY }}
          ZEN_RELEASES_TOKEN: ${{ secrets.ZEN_RELEASES_TOKEN }}
          ZEN_RELEASES_SERVER: ${{ vars.ZEN_RELEASES_SERVER }}
        run: cargo xtask release-ci live

  publish:
    name: Publish the GitHub release
    needs: live
    if: "!cancelled() && needs.live.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
