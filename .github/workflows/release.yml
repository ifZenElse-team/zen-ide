name: Release

# The release of the commit the branch `release` points at, at the calendar's next version
# (ADR-0300, ADR-0301, docs/releasing.md). A push to `release` starts it; `release` only ever points
# at a commit of `main` and moves forward. A pushed tag starts nothing: the tag v<version> is made
# by the last job, after the release is live.
#
# - build: the workflow `release-parts.yml`, the same jobs the nightly dry run calls: the plan (which
#   stops the run before anything is built when the commit, the ref, the notes, the version or the
#   environment are not what a release needs, and fixes the version), the gate, every build, the
#   join. It reads no secret, signs nothing and publishes nothing.
# - stage (environment `release`, its reviewers approve): signs the manifest and the catalog and
#   stages everything on the release server; nothing is live.
# - verify: downloads every staged file and checks it against the build.
# - draft: writes the draft GitHub release for the released commit (the only jobs with
#   `contents: write` are this one and `publish`, and neither has a release secret).
# - live (environment `release`, its reviewers approve): one request makes the stage live.
# - publish: creates the tag v<version> on the released commit and publishes the draft.
#
# The release secrets are given only to the one step of `stage` and of `live` that signs or sends,
# after everything those jobs compile is compiled; the first step of each checks that they are set,
# printing only whether they are. `stage` and `live` release only the commit of the run, and only
# while `release` still points at it.

on:
  push:
    branches: [release]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  TZ: UTC

jobs:
  build:
    name: Build
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/release-parts.yml
    with:
      dry-run: false

  stage:
    name: Stage
    needs: build
    if: "!cancelled() && needs.build.result == 'success'"
    env:
      TAG: ${{ needs.build.outputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: release
    concurrency:
      group: release-server
      cancel-in-progress: false
    steps:
      - name: The release secrets are set (only whether they are is printed)
        env:
          HAS_KEY: ${{ secrets.ZEN_PUBLISHER_KEY != '' }}
          HAS_TOKEN: ${{ secrets.ZEN_RELEASES_TOKEN != '' }}
          HAS_SERVER: ${{ vars.ZEN_RELEASES_SERVER != '' }}
        run: |
          set -eu
          missing=""
          [ "$HAS_KEY" = true ] || missing="$missing ZEN_PUBLISHER_KEY"
          [ "$HAS_TOKEN" = true ] || missing="$missing ZEN_RELEASES_TOKEN"
          [ "$HAS_SERVER" = true ] || missing="$missing ZEN_RELEASES_SERVER"
          if [ -n "$missing" ]; then
            echo "::error::The environment release lacks:$missing (Settings, Environments, release); nothing was signed or sent."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: .
      - name: Build the release tools (no secret is in this step)
        run: |
          set -eu
          cargo build --locked --package xtask
          cargo build --release --locked --package zen-releases
      - name: Sign and stage
        env:
          ZEN_PUBLISHER_KEY: ${{ secrets.ZEN_PUBLISHER_KEY }}
          ZEN_RELEASES_TOKEN: ${{ secrets.ZEN_RELEASES_TOKEN }}
          ZEN_RELEASES_SERVER: ${{ vars.ZEN_RELEASES_SERVER }}
        run: cargo xtask release-ci stage "$TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage
          path: release-stage.json
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Verify
    needs: [build, stage]
    if: "!cancelled() && needs.stage.result == 'success'"
    env:
      TAG: ${{ needs.build.outputs.tag }}
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stage
          path: .
      - name: Download every staged file and check it
        run: cargo xtask release-ci verify "$TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify
          path: release-verify.json
          if-no-files-found: error
          retention-days: 7

  draft:
    name: Draft of the GitHub release
    needs: [build, stage, verify]
    if: "!cancelled() && needs.stage.result == 'success' && needs.verify.result == 'success'"
    env:
      TAG: ${{ needs.build.outputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stage
          path: .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verify
          path: .
      - name: The notes, the files and the checks
        run: |
          set -eu
          cargo xtask release-ci notes "$TAG"
          cat release-notes.md
      - name: Write the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          case "$state" in
            true) gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "Zen IDE ${TAG#v}" --notes-file release-notes.md ;;
            none) gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "Zen IDE ${TAG#v}" --notes-file release-notes.md ;;
            *) echo "::error::The release of $TAG is published already; the draft was not written."; exit 1 ;;
          esac
          # A draft makes no tag; publishing does (in `publish`, after the release is live).
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "The tag $TAG exists already; publish checks that it is the released commit."
          fi

  live:
    name: Release
    needs: [build, stage, verify, draft]
    if: "!cancelled() && needs.stage.result == 'success' && needs.verify.result == 'success' && needs.draft.result == 'success'"
    env:
      TAG: ${{ needs.build.outputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    concurrency:
      group: release-server
      cancel-in-progress: false
    steps:
      - name: The release secrets are set (only whether they are is printed)
        env:
          HAS_KEY: ${{ secrets.ZEN_PUBLISHER_KEY != '' }}
          HAS_TOKEN: ${{ secrets.ZEN_RELEASES_TOKEN != '' }}
          HAS_SERVER: ${{ vars.ZEN_RELEASES_SERVER != '' }}
        run: |
          set -eu
          missing=""
          [ "$HAS_KEY" = true ] || missing="$missing ZEN_PUBLISHER_KEY"
          [ "$HAS_TOKEN" = true ] || missing="$missing ZEN_RELEASES_TOKEN"
          [ "$HAS_SERVER" = true ] || missing="$missing ZEN_RELEASES_SERVER"
          if [ -n "$missing" ]; then
            echo "::error::The environment release lacks:$missing (Settings, Environments, release); nothing was signed or sent."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stage
          path: .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verify
          path: .
      - name: Build the release tools (no secret is in this step)
        run: |
          set -eu
          cargo build --locked --package xtask
          cargo build --release --locked --package zen-releases
      - name: Make the stage live
        env:
          ZEN_PUBLISHER_KEY: ${{ secrets.ZEN_PUBLISHER_KEY }}
          ZEN_RELEASES_TOKEN: ${{ secrets.ZEN_RELEASES_TOKEN }}
          ZEN_RELEASES_SERVER: ${{ vars.ZEN_RELEASES_SERVER }}
        run: cargo xtask release-ci live "$TAG"

  publish:
    name: Publish the GitHub release
    needs: [build, live]
    if: "!cancelled() && needs.live.result == 'success'"
    env:
      TAG: ${{ needs.build.outputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: The tag of the release, on the released commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          found=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" --jq ".[] | select(.ref == \"refs/tags/$TAG\") | .object.sha")
          if [ -z "$found" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null || {
              echo "::error::GitHub refused to create the tag $TAG on $GITHUB_SHA. The release is live; the tag ruleset must let this workflow create release tags (docs/releasing.md), or an organisation admin creates the tag on $GITHUB_SHA by hand. Then re-run this job."
              exit 1
            }
            echo "Created the tag $TAG on $GITHUB_SHA."
          elif [ "$found" = "$GITHUB_SHA" ]; then
            echo "The tag $TAG is on $GITHUB_SHA already."
          else
            echo "::error::The tag $TAG points at $found, not at the released commit $GITHUB_SHA; nothing was published. An organisation admin moves or deletes it, then re-runs this job."
            exit 1
          fi
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
