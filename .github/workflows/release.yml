name: Release

# The release of a tag v<YY.M.N> (ADR-0300, docs/releasing.md "Releasing from a tag on GitHub").
# Up to `join` it reads no secret, signs nothing and publishes nothing. The jobs after `join` run
# only when the repository variable ZEN_RELEASE_FROM_GITHUB is `true`; until the owner sets it, a
# tag's run ends with the artefact `release`.
#
# - plan: what the tag releases, as the jobs below; refuses notes that are not gathered.
# - gate: the full quality gate, once, on macOS.
# - macos, cross, extras: the release builds, each recording the gate as deferred.
# - join: checks every part against its build.json and the gate's pass, and lays them out as one
#   release, kept as the workflow artefact `release`.
#
# - stage (environment `release`): signs the manifest and the catalog and stages everything on the
#   release server; nothing is live.
# - verify: downloads every staged file and checks it against the build.
# - draft: writes the draft GitHub release of the tag (the only jobs with `contents: write` are
#   this one and `publish`, and neither has a release secret).
# - live (environment `release`, its reviewers approve): one request makes the stage live.
# - publish: publishes the draft.
#
# The release secrets are given only to the one step of `stage` and of `live` that signs or sends,
# after everything those jobs compile is compiled.
#
# No product build restores a cache. The two small jobs that only build xtask restore the cache
# that the workflows of `main` write (never one written by a pull request: GitHub keeps a cache
# within the ref that wrote it plus the default branch, no pull request's workflow here saves one,
# and this workflow saves none).

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  TZ: UTC

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: xtask
          save-if: false
      - name: What the tag releases
        id: matrix
        run: |
          set -eu
          cargo xtask release-ci matrix
          echo "matrix=$(cat release-matrix.json)" >> "$GITHUB_OUTPUT"

  gate:
    name: Quality gate
    runs-on: macos-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-deny
      - name: Versions
        run: rustc --version && cargo --version && cargo deny --version && sw_vers
      - name: The full gate
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo xtask release-ci gate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate
          path: release-gate.json
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS, ${{ matrix.job.name }}
    needs: plan
    runs-on: macos-latest
    timeout-minutes: 180
    strategy:
      fail-fast: true
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.matrix).macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The runner is Apple silicon
        run: test "$(uname -m)" = arm64
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Versions
        run: rustc --version && cargo --version && sw_vers
      - name: Build
        env:
          PARTS: ${{ matrix.job.parts }}
        run: |
          set -eu
          for part in $PARTS; do cargo xtask release-ci part "$part" macos; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: part-macos-${{ strategy.job-index }}
          path: release-build/parts
          if-no-files-found: error
          retention-days: 7

  cross:
    name: ${{ matrix.job.name }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.matrix).cross }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        if: matrix.job.platform == 'linux'
        with:
          tool: cargo-zigbuild
      - name: Zig (the linker of the Linux build, ADR-0150)
        if: matrix.job.platform == 'linux'
        run: |
          set -eu
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --quiet ziglang==0.17.0
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec "%s" -m ziglang "$@"\n' "$RUNNER_TEMP/zig/bin/python" > "$RUNNER_TEMP/bin/zig"
          chmod +x "$RUNNER_TEMP/bin/zig"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: MinGW-w64 (the linker of the Windows build, ADR-0150)
        if: matrix.job.platform == 'windows'
        run: |
          set -eu
          rustup target add x86_64-pc-windows-gnu
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64 mingw-w64-x86-64-dev
      - name: Versions
        run: rustc --version && cargo --version
      - name: Build
        env:
          PART: ${{ matrix.job.part }}
          PLATFORM: ${{ matrix.job.platform }}
        run: cargo xtask release-ci part "$PART" "$PLATFORM"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: part-${{ matrix.job.part }}-${{ matrix.job.platform }}
          path: release-build/parts
          if-no-files-found: error
          retention-days: 7

  extras:
    name: macOS, Zen Toolbox and plug-ins
    needs: plan
    if: fromJSON(needs.plan.outputs.matrix).extras != ''
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The runner is Apple silicon
        run: test "$(uname -m)" = arm64
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        if: contains(fromJSON(needs.plan.outputs.matrix).extras, 'plugins')
        with:
          tool: cargo-zigbuild
      - name: Zig and MinGW-w64 (the driver programs of plug-ins, for Linux and Windows)
        if: contains(fromJSON(needs.plan.outputs.matrix).extras, 'plugins')
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -eu
          brew install zig mingw-w64
          rustup target add x86_64-unknown-linux-gnu x86_64-pc-windows-gnu
      - name: Versions
        run: rustc --version && cargo --version && sw_vers
      - name: Build
        env:
          PARTS: ${{ fromJSON(needs.plan.outputs.matrix).extras }}
        run: |
          set -eu
          for part in $PARTS; do
            case "$part" in
              plugins) cargo xtask release-ci part plugins all ;;
              *) cargo xtask release-ci part "$part" macos ;;
            esac
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: part-macos-extras
          path: release-build/parts
          if-no-files-found: error
          retention-days: 7

  join:
    name: Join
    needs: [plan, gate, macos, cross, extras]
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.gate.result == 'success' &&
      needs.macos.result == 'success' && needs.cross.result == 'success' &&
      (needs.extras.result == 'success' || needs.extras.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: xtask
          save-if: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gate
          path: .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: part-*
          path: release-build/parts
          merge-multiple: true
      - name: Join the parts into one release
        run: |
          set -eu
          cargo xtask release-ci join
          find release-build -type f -name build.json | sort
          cat release-build/release-plan.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            release-build
            release-gate.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  stage:
    name: Stage
    needs: join
    if: "!cancelled() && needs.join.result == 'success' && vars.ZEN_RELEASE_FROM_GITHUB == 'true'"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: release
    concurrency:
      group: release-server
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: .
      - name: Build the release tools (no secret is in this step)
        run: |
          set -eu
          cargo build --locked --package xtask
          cargo build --release --locked --package zen-releases
      - name: Sign and stage
        env:
          ZEN_PUBLISHER_KEY: ${{ secrets.ZEN_PUBLISHER_KEY }}
          ZEN_RELEASES_TOKEN: ${{ secrets.ZEN_RELEASES_TOKEN }}
          ZEN_RELEASES_SERVER: ${{ vars.ZEN_RELEASES_SERVER }}
        run: cargo xtask release-ci stage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage
          path: release-stage.json
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Verify
    needs: stage
    if: "!cancelled() && needs.stage.result == 'success'"
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stage
          path: .
      - name: Download every staged file and check it
        run: cargo xtask release-ci verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify
          path: release-verify.json
          if-no-files-found: error
          retention-days: 7

  draft:
    name: Draft of the GitHub release
    needs: [stage, verify]
    if: "!cancelled() && needs.stage.result == 'success' && needs.verify.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stage
          path: .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verify
          path: .
      - name: The notes, the files and the checks
        run: |
          set -eu
          cargo xtask release-ci notes
          cat release-notes.md
      - name: Write the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          state=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          case "$state" in
            true) gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft --title "Zen IDE ${tag#v}" --notes-file release-notes.md ;;
            none) gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Zen IDE ${tag#v}" --notes-file release-notes.md ;;
            *) echo "The release of $tag is published already; the draft was not written."; exit 1 ;;
          esac

  live:
    name: Release
    needs: [stage, verify, draft]
    if: "!cancelled() && needs.stage.result == 'success' && needs.verify.result == 'success' && needs.draft.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    concurrency:
      group: release-server
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stage
          path: .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verify
          path: .
      - name: Build the release tools (no secret is in this step)
        run: |
          set -eu
          cargo build --locked --package xtask
          cargo build --release --locked --package zen-releases
      - name: Make the stage live
        env:
          ZEN_PUBLISHER_KEY: ${{ secrets.ZEN_PUBLISHER_KEY }}
          ZEN_RELEASES_TOKEN: ${{ secrets.ZEN_RELEASES_TOKEN }}
          ZEN_RELEASES_SERVER: ${{ vars.ZEN_RELEASES_SERVER }}
        run: cargo xtask release-ci live

  publish:
    name: Publish the GitHub release
    needs: live
    if: "!cancelled() && needs.live.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
