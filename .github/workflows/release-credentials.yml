name: Release credentials

# Checks, without publishing anything, that the signing key parses and that the release server
# accepts the upload token and trusts the key (docs/releasing.md). Started by hand, on `main`.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-server
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: Check the key and the token
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build the release tools (no secret is in this step)
        run: |
          set -eu
          cargo build --locked --package xtask
          cargo build --release --locked --package zen-releases
      - name: Check
        env:
          ZEN_PUBLISHER_KEY: ${{ secrets.ZEN_PUBLISHER_KEY }}
          ZEN_RELEASES_TOKEN: ${{ secrets.ZEN_RELEASES_TOKEN }}
          ZEN_RELEASES_SERVER: ${{ vars.ZEN_RELEASES_SERVER }}
        run: cargo xtask release-ci credentials
