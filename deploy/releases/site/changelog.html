<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zen IDE Changelog</title>
<meta name="description" content="Every release of Zen Toolbox, the Zen IDEs and their plug-ins, newest first.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0E0F15">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238B7CF8'/%3E%3Cstop offset='1' stop-color='%234338CA'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='url(%23g)'/%3E%3Cpath d='M35 16.3A16 16 0 1 1 23.4 18.5' fill='none' stroke='%23fff' stroke-width='5.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* Inter (SIL Open Font License 1.1, see /fonts/OFL-Inter.txt), served from this host. */
@font-face { font-family: "Inter"; src: url("/fonts/Inter-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Inter"; src: url("/fonts/Inter-SemiBold.ttf") format("truetype"); font-weight: 600; font-display: swap; }
@font-face { font-family: "Inter"; src: url("/fonts/Inter-Bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }

:root {
  --ink-top: #24203A;
  --ink-bottom: #0E0F15;
  --text: #EEEFF4;
  --text-2: #9AA0B0;
  --link: #A9ACFF;
  --panel: rgba(255, 255, 255, 0.04);
  --edge: rgba(255, 255, 255, 0.09);
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html { background: var(--ink-bottom); }
body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.6;
  color: var(--text);
  background:
    radial-gradient(60rem 30rem at 50% -10rem, rgba(124, 127, 247, 0.18), transparent 70%),
    linear-gradient(180deg, var(--ink-top) 0%, #171824 30%, #12131B 70%, var(--ink-bottom) 100%);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--link); text-underline-offset: 3px; }
a:hover { color: #C6C8FF; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; border-radius: 6px; }

.wrap { max-width: 880px; margin: 0 auto; padding: 0 16px; }
header { padding: 40px 0 8px; }
.home { font-size: 0.9rem; text-decoration: none; color: var(--text-2); }
.home:hover { color: var(--text); }
h1 { margin: 18px 0 6px; font-size: clamp(2rem, 6vw, 2.8rem); font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; }
.lead { margin: 0; color: var(--text-2); }

nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 28px 0 8px; }
nav a {
  padding: 6px 14px; border-radius: 999px; text-decoration: none; font-size: 0.9rem;
  color: var(--text-2); background: var(--panel); border: 1px solid var(--edge);
}
nav a:hover { color: var(--text); }
nav a[aria-current="page"] { color: var(--text); background: rgba(124, 127, 247, 0.22); border-color: rgba(169, 172, 255, 0.4); }
nav .group { width: 100%; margin: 10px 0 0; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-2); }

main { padding-bottom: 64px; }
.release {
  margin-top: 16px; padding: 22px 24px;
  background: var(--panel); border: 1px solid var(--edge); border-radius: 16px;
}
.release h2 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin: 0 0 8px; font-size: 1.2rem; font-weight: 600; }
.release h2 a { color: inherit; text-decoration: none; }
.release h2 time { font-size: 0.9rem; font-weight: 400; color: var(--text-2); }
.release h3 { margin: 16px 0 4px; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--link); }
.release p { margin: 8px 0; }
.release ul { margin: 8px 0; padding-left: 1.25rem; }
.release li { margin: 4px 0; }
.release code { font-family: var(--mono); font-size: 0.88em; padding: 1px 5px; border-radius: 5px; background: rgba(8, 9, 14, 0.6); border: 1px solid var(--edge); overflow-wrap: anywhere; }
.empty, .message { color: var(--text-2); }

footer { padding: 24px 0 40px; border-top: 1px solid var(--edge); color: var(--text-2); font-size: 0.85rem; }
@media (max-width: 520px) { .release { padding: 18px 16px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="home" href="/">← Zen IDE</a> · <a class="home" href="/docs/">Documentation</a>
    <h1>Changelog</h1>
    <p class="lead">Every release of Zen Toolbox, the Zen IDEs and their plug-ins, newest first.</p>
    <nav id="tools" aria-label="Products and plug-ins"></nav>
  </header>
  <main id="releases"><p class="message">Loading the changelog…</p></main>
  <footer>Zen IDE is made by <strong>ifzenelse</strong>. The notes are the ones Zen Toolbox shows under What's new.</footer>
</div>

<script>
// Renders /releases/changelog.json (`cargo xtask changelog --json`, published with every release;
// changelog/README.md). One product or plug-in at a time, chosen by the address's fragment
// (`#gogarden`), newest release first. The notes are Markdown; the small renderer below knows the
// subset the changelogs use (### headings, paragraphs, - lists, **bold**, *italics*, `code`, links)
// and escapes everything else.
(function () {
  "use strict";
  var nav = document.getElementById("tools");
  var main = document.getElementById("releases");
  var changelogs = [];

  function escape(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // Inline Markdown on escaped text; code spans are set aside first so that nothing inside them changes.
  function inline(text) {
    var codes = [];
    var html = escape(text).replace(/`([^`]+)`/g, function (_, code) {
      codes.push("<code>" + code + "</code>");
      return "\u0000" + (codes.length - 1) + "\u0000";
    });
    html = html
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
      .replace(/\[([^\]]+)\]\(((?:https?:\/\/|\/)[^)\s]*)\)/g, '<a href="$2">$1</a>');
    return html.replace(/\u0000(\d+)\u0000/g, function (_, index) { return codes[Number(index)]; });
  }

  function markdown(text) {
    var html = [];
    var paragraph = [];
    var items = null;
    function flush() {
      if (paragraph.length) { html.push("<p>" + inline(paragraph.join(" ")) + "</p>"); paragraph = []; }
      if (items) { html.push("<ul>" + items.map(function (item) { return "<li>" + inline(item) + "</li>"; }).join("") + "</ul>"); items = null; }
    }
    text.split("\n").forEach(function (line) {
      var heading = /^#{1,6}\s+(.*)$/.exec(line);
      var item = /^[-*]\s+(.*)$/.exec(line);
      if (heading) { flush(); html.push("<h3>" + inline(heading[1]) + "</h3>"); }
      else if (item) { if (paragraph.length) flush(); items = items || []; items.push(item[1]); }
      else if (!line.trim()) { flush(); }
      else if (items && /^\s+/.test(line)) { items[items.length - 1] += " " + line.trim(); }
      else { if (items) flush(); paragraph.push(line.trim()); }
    });
    flush();
    return html.join("");
  }

  function show() {
    var id = decodeURIComponent(location.hash.slice(1)) || (changelogs[0] && changelogs[0].id);
    var log = changelogs.filter(function (log) { return log.id === id; })[0] || changelogs[0];
    if (!log) { main.innerHTML = '<p class="message">No releases yet.</p>'; return; }
    Array.prototype.forEach.call(nav.querySelectorAll("a"), function (link) {
      if (link.dataset.id === log.id) link.setAttribute("aria-current", "page"); else link.removeAttribute("aria-current");
    });
    document.title = log.name + " Changelog";
    if (!log.releases.length) { main.innerHTML = '<p class="empty">No releases yet.</p>'; return; }
    main.innerHTML = log.releases.map(function (release) {
      var anchor = log.id + "-" + release.version;
      var notes = release.notes.trim() ? markdown(release.notes) : '<p class="empty">No notes for this release.</p>';
      return '<section class="release" id="' + escape(anchor) + '"><h2><a href="#' + escape(log.id) + '">' +
        escape(log.name) + " " + escape(release.version) + '</a><time datetime="' + escape(release.date) + '">' +
        escape(release.date) + "</time></h2>" + notes + "</section>";
    }).join("");
  }

  fetch("/releases/changelog.json", { cache: "no-cache" })
    .then(function (response) { if (!response.ok) throw new Error(response.status); return response.json(); })
    .then(function (data) {
      changelogs = (data.changelogs || []).filter(function (log) { return log.releases && log.releases.length; });
      var html = [];
      ["product", "plugin"].forEach(function (kind) {
        var logs = changelogs.filter(function (log) { return log.kind === kind; });
        if (!logs.length) return;
        if (kind === "plugin") html.push('<p class="group">Plug-ins</p>');
        logs.forEach(function (log) {
          html.push('<a href="#' + escape(log.id) + '" data-id="' + escape(log.id) + '">' + escape(log.name.replace(/ plug-in$/, "")) + "</a>");
        });
      });
      nav.innerHTML = html.join("");
      show();
    })
    .catch(function () { main.innerHTML = '<p class="message">The changelog cannot be loaded right now.</p>'; });
  window.addEventListener("hashchange", show);
})();
</script>
</body>
</html>
