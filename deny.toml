# cargo-deny configuration, run by `cargo xtask ci` (step "deny").
# The licence policy implements docs/adr/0002-open-source-clean-room-pure-rust.md, decision 6:
# permissive licences compatible with MIT and Apache-2.0 only; no GPL or AGPL.

[graph]
all-features = true

[advisories]
# Every RustSec advisory fails the check unless it is listed here with a reason.
ignore = [
    # ttf-parser is unmaintained; it comes in through egui's text rendering and has no replacement
    # in egui 0.37. Revisit with every egui upgrade.
    { id = "RUSTSEC-2026-0192", reason = "transitive through egui 0.37, no maintained alternative yet" },
    # chrono is unmaintained (no known vulnerability); it comes in only through arrow and parquet 60,
    # which the database module uses to read Parquet files. Revisit with every arrow upgrade; drop
    # this when arrow moves to jiff or another maintained crate.
    { id = "RUSTSEC-2026-0543", reason = "transitive through arrow and parquet 60, unmaintained, not vulnerable" },
    # zvariant, zvariant_derive and zbus_names were merged into zbus 6; they come in through
    # egui-winit's accessibility on Linux (accesskit_unix, zbus 5). Revisit with the egui upgrade
    # that moves accesskit to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "transitive through egui 0.37 accessibility on Linux (zbus 5)" },
    { id = "RUSTSEC-2026-0371", reason = "transitive through egui 0.37 accessibility on Linux (zbus 5)" },
    { id = "RUSTSEC-2026-0372", reason = "transitive through egui 0.37 accessibility on Linux (zbus 5)" },
    # rustls-rustcrypto 0.0.2-alpha, the pure-Rust TLS provider (ADR-0040). Revisit with every release
    # of the provider; drop these when it moves to maintained versions.
    # rustls-webpki 0.102: the provider uses it only for algorithm identifiers; certificate chains,
    # names and CRLs are checked by rustls through rustls-webpki 0.103, which has the fixes.
    { id = "RUSTSEC-2026-0049", reason = "rustls-webpki 0.102 used for algorithm identifiers only (ADR-0040)" },
    { id = "RUSTSEC-2026-0098", reason = "rustls-webpki 0.102 used for algorithm identifiers only (ADR-0040)" },
    { id = "RUSTSEC-2026-0099", reason = "rustls-webpki 0.102 used for algorithm identifiers only (ADR-0040)" },
    { id = "RUSTSEC-2026-0104", reason = "rustls-webpki 0.102 used for algorithm identifiers only (ADR-0040)" },
    { id = "RUSTSEC-2026-0382", reason = "rustls-webpki 0.102 used for algorithm identifiers only (ADR-0040)" },
    # rsa 0.9 (Marvin): a timing leak of operations with a private key; a TLS client without client
    # certificates only verifies signatures with public keys.
    { id = "RUSTSEC-2023-0071", reason = "no RSA private-key operations in a TLS client (ADR-0040)" },
    # crypto-bigint 0.5 (timing of operations meant to be constant-time): it comes in through
    # elliptic-curve 0.13 for P-256, which the provider uses to verify ECDSA signatures with public
    # keys and, when a server prefers it over X25519, for an ephemeral key exchange of one handshake.
    # The fix is in 0.7.6, which elliptic-curve 0.13 cannot take; drop this with the provider's move.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 through elliptic-curve 0.13 of the TLS provider (ADR-0040)" },
    # paste is unmaintained; it is a compile-time macro of the provider.
    { id = "RUSTSEC-2024-0436", reason = "compile-time macro of rustls-rustcrypto (ADR-0040)" },
]

[licenses]
confidence-threshold = 0.9
# The list is the policy, not an inventory: a licence may be allowed before any dependency uses it.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    # Public-domain dedication (ksni, the pure-Rust Linux tray backend).
    "Unlicense",
    # Allowed for unmodified use only; modifying an MPL-licensed file requires publishing it.
    "MPL-2.0",
    # webpki-roots: Mozilla's root certificates as data, a permissive data licence (ADR-0040).
    "CDLA-Permissive-2.0",
]

# Font licences, allowed only for the crate that bundles egui's fallback fonts (Hack, Ubuntu-Light,
# Noto Emoji, emoji-icon-font). Fonts are bundled, unmodified data; their notices are in NOTICE and
# ATTRIBUTION.md.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

[licenses.private]
# Workspace crates are not published, but they are licensed MIT OR Apache-2.0 like everything else.
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path; they are never published (publish = false).
allow-wildcard-paths = true
# Native code is allowed only behind an opt-in feature in an edge crate, with an ADR (ADR-0002).
# A database driver feature that would bring a C crypto or SQLite library fails here (ADR-0164).
deny = [
    { crate = "ring", reason = "C and assembly; TLS uses rustls with RustCrypto (ADR-0040, ADR-0164)" },
    { crate = "aws-lc-rs", reason = "C; TLS uses rustls with RustCrypto (ADR-0040, ADR-0164)" },
    { crate = "aws-lc-sys", reason = "C; TLS uses rustls with RustCrypto (ADR-0040, ADR-0164)" },
    { crate = "openssl-sys", reason = "C; TLS uses rustls with RustCrypto (ADR-0040, ADR-0164)" },
    { crate = "native-tls", reason = "OpenSSL on Linux; TLS uses rustls (ADR-0040, ADR-0164)" },
    { crate = "libsqlite3-sys", reason = "C; SQLite runs as the system sqlite3 program (ADR-0164)" },
    { crate = "zstd-sys", reason = "C; Parquet uses only pure-Rust codecs (ADR-0181)" },
    { crate = "lz4-sys", reason = "C; Parquet uses only pure-Rust codecs (ADR-0181)" },
    { crate = "snappy-sys", reason = "C; Parquet uses only pure-Rust codecs (ADR-0181)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
