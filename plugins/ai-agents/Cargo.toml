[package]
name = "zen-plugin-ai-agents"
description = "Zen IDE plug-in: resume adapters for AI agents in the terminal: Claude Code, Codex, Qwen Code (ADR-0050, ADR-0275)."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
serde_json.workspace = true

[lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
