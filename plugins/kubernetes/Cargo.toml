[package]
name = "zen-plugin-kubernetes"
description = "Zen IDE plug-in: the Kubernetes tool window over kubectl: contexts, namespaces, pods, deployments, services, config maps, secrets by name and events (ADR-0289, ADR-0290)."
version = "0.3.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json.workspace = true

[lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
