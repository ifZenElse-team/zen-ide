[package]
name = "zen-plugin-kotlin"
description = "Zen IDE plug-in: Kotlin and Kotlin scripts (Gradle's Kotlin DSL) with our own lexer, and the Kotlin language server (ADR-0031, ADR-0151)."
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json.workspace = true

[lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
