[package]
name = "zen-plugin-sveltekit"
description = "Zen IDE plug-in: SvelteKit projects, their run configurations, setup and route file templates, on the Svelte plug-in (ADR-0031, ADR-0133)."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
serde_json.workspace = true

[lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
