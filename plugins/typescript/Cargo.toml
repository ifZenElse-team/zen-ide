[package]
name = "zen-plugin-typescript"
description = "Zen IDE plug-in: TypeScript and TSX highlighting, folding, Structure and completion (ADR-0031)."
version = "0.4.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib: the WebAssembly module; rlib: so that the analyser is unit-tested on the host.
crate-type = ["cdylib", "rlib"]

# The workspace lints, except that `unsafe_code` is `deny` instead of `forbid`: WebAssembly exports
# need `#[unsafe(no_mangle)]`, allowed on those items only (ADR-0031, rule 3).
[lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
